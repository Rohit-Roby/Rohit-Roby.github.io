name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npx tsc

      - name: Deploy (Optional for GitHub Pages)
        uses: actions/deploy-pages@v4
        with:
          path: 'dist/' # Adjust based on your output directory
